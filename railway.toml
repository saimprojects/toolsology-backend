[build]
builder = "nixpacks"
nixpacksVersion = "1.27.0"

[build.environment]
PYTHON_VERSION = "3.12"
DJANGO_SETTINGS_MODULE = "config.settings"

[deploy]
startCommand = "sh -c 'python manage.py collectstatic --noinput && python manage.py migrate --noinput && (python manage.py sync_supplier_bots --loop &) && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120'"
healthcheckPath = "/health/"
healthcheckTimeout = 30
